<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The truck's HUD, drawn flat over this player's own camera. DriverSystem sends everything as
     engine.state.hud once a frame and the driver bridge sends the cargo bay as engine.state.bay;
     this page only lays them out. Sizes are in vh so any window works. -->
<style>
	:root {
		--panel: rgba(6, 10, 20, 0.58);
		--edge: rgba(130, 170, 255, 0.16);
		--label: #7f8fae;
		--text: #e8ecf4;
		--accent: #6fd3ff;
		--good: #66ff80;
		--warn: #ffcc40;
		--bad: #ff4d40;
		--track: rgba(120, 140, 180, 0.18);
	}
	html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
	/* The page opens at GO and fades in as the countdown's GO fades out (Title.html). */
	body { animation: hud-in 0.8s ease-out; }
	@keyframes hud-in { from { opacity: 0; } to { opacity: 1; } }
	body { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 2.2vh; color: var(--text);
		text-shadow: 0 0 0.3vh rgba(0, 0, 0, 0.8); }
	.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
	.panel { position: absolute; background: var(--panel); border: 1px solid var(--edge); border-radius: 1vh;
		box-shadow: 0 0.6vh 2.5vh rgba(0, 0, 0, 0.35); padding: 1.1vh 1.4vh; box-sizing: border-box; }
	.head { font-size: 1.25vh; letter-spacing: 0.3em; color: var(--label); margin-bottom: 0.8vh;
		display: flex; justify-content: space-between; }
	.head b { font-weight: normal; color: var(--accent); }
	.stat { display: flex; justify-content: space-between; align-items: baseline; line-height: 2.9vh; }
	.stat .k { font-size: 1.35vh; letter-spacing: 0.18em; color: var(--label); }
	.stat .v { font-size: 2.2vh; }
	.meter { height: 0.35vh; background: var(--track); border-radius: 0.2vh; margin: -0.2vh 0 0.5vh; overflow: hidden; }
	.meter div { height: 100%; border-radius: 0.2vh; }

	#dark { background: #000; opacity: 0; }
	/* Red welling up from the bottom of the screen, behind you, while something feeds in the bay. */
	#rear { background: radial-gradient(ellipse 80% 45% at 50% 100%, rgba(255, 50, 40, 0.55), rgba(255, 50, 40, 0) 70%);
		opacity: 0; transition: opacity 0.4s; }
	#rear.on { animation: rear 1.4s ease-in-out infinite; }
	@keyframes rear { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

	#left { left: 2vh; top: 2vh; width: 27vh; }
	#right { right: 2vh; top: 2vh; width: 25vh; }
	#clock { left: 50%; top: 1.6vh; width: 24vh; margin-left: -12vh; text-align: center; padding: 0.8vh 0 1vh; }
	#clock .k { font-size: 1.25vh; letter-spacing: 0.35em; color: var(--label); }
	#clock .v { font-size: 4.4vh; line-height: 1.1; letter-spacing: 0.05em; }

	#alert { position: absolute; left: 0; right: 0; top: 12.5vh; text-align: center; display: none; }
	#alert span { display: inline-block; padding: 0.7vh 1.8vh; border-radius: 2vh; font-size: 1.7vh; letter-spacing: 0.2em;
		background: rgba(70, 8, 8, 0.75); border: 1px solid rgba(255, 77, 64, 0.7); color: #ffd0cc; }
	#alert.feeding span { animation: alert 0.9s ease-in-out infinite; }
	@keyframes alert { 0%, 100% { box-shadow: 0 0 0 rgba(255, 77, 64, 0); } 50% { box-shadow: 0 0 2.5vh rgba(255, 77, 64, 0.85); } }

	#center { position: absolute; left: 0; right: 0; top: 27%; text-align: center; line-height: 1.6; }
	#blackout { position: absolute; left: 0; right: 0; top: 45%; text-align: center; display: none; }
	#blackout .big { font-size: 5vh; color: var(--bad); letter-spacing: 0.2em; }
	#blackout .dim { color: var(--label); letter-spacing: 0.15em; }
	#prompts { position: absolute; left: 0; right: 0; top: 73%; text-align: center; line-height: 1.7; font-size: 1.9vh; }

	#nav { left: 50%; width: 74vh; margin-left: -37vh; bottom: 2.4vh; padding: 1.2vh 2vh 1.3vh; }
	#nav .row { display: flex; justify-content: space-between; align-items: baseline; }
	#nav .row .k { font-size: 2.2vh; }
	#nav .row .v { font-size: 1.7vh; color: var(--label); letter-spacing: 0.1em; }
	.track { position: relative; height: 0.9vh; background: var(--track); border-radius: 0.5vh; margin: 0.8vh 0 1.1vh; }
	.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0.5vh; }
	#progress { background: linear-gradient(90deg, rgba(102, 255, 128, 0.35), var(--good)); }
	/* The truck, riding the tip of the progress bar. */
	#pip { position: absolute; top: 50%; width: 1.6vh; height: 1.6vh; margin: -0.8vh 0 0 -0.8vh; border-radius: 50%;
		background: #fff; box-shadow: 0 0 1vh var(--good); }
	.end { position: absolute; top: 1.4vh; font-size: 1.15vh; letter-spacing: 0.25em; color: var(--label); }
	#gaugeTrack { height: 0.5vh; margin: 0.6vh 0 0; }

	#bay { right: 2vh; bottom: 2.4vh; width: 21vh; padding: 1vh 1.2vh; transition: border-color 0.3s; }
	#bay.alarm { border-color: rgba(255, 77, 64, 0.85); animation: bay 0.9s ease-in-out infinite; }
	@keyframes bay { 0%, 100% { box-shadow: 0 0 0 rgba(255, 77, 64, 0); } 50% { box-shadow: 0 0 2vh rgba(255, 77, 64, 0.6); } }
	#bay svg { display: block; width: 11vh; height: 22vh; margin: 0 auto; }
	#bay .foot { font-size: 1.2vh; letter-spacing: 0.15em; margin-top: 0.7vh; text-align: center; color: var(--label); }
	.mite { animation: mite 0.6s ease-in-out infinite; }
	@keyframes mite { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

	#sight { display: none; overflow: visible; }
	/* A chevron on the screen's edge, pointing out toward the colony. */
	#arrow { position: absolute; display: none; width: 0; height: 0; margin: -1.4vh 0 0 -1vh;
		border-top: 1.4vh solid transparent; border-bottom: 1.4vh solid transparent; border-left: 2.2vh solid var(--warn);
		filter: drop-shadow(0 0 0.6vh rgba(255, 204, 64, 0.8)); }

	#ticket { position: absolute; right: 3vh; top: 30%; text-align: center; padding: 1vh; border-radius: 0.6vh;
		background: #f2d980; color: #991a33; text-shadow: none; box-shadow: 0 1vh 3vh rgba(0, 0, 0, 0.6);
		transform: translate(0, 0) rotate(-4deg); transition: transform 0.45s cubic-bezier(0.2, 1.4, 0.4, 1); }
	/* Tucked away below the right edge, like it is still in your pocket. */
	#ticket.pocket { transform: translate(140%, 70vh) rotate(35deg); transition: transform 0.3s ease-in; }
	#ticket .title { color: #b37a00; font-size: 3vh; margin-bottom: 0.5vh; }
	#ticket .card { position: relative; background: #faf5e0; }
	#ticket .prize { position: absolute; left: 0; right: 0; top: 50%; margin-top: -2.5vh; font-size: 5vh; }
	#ticket canvas { position: relative; display: block; }
	#ticket .coin { position: absolute; width: 3vh; height: 3vh; margin: -1.5vh 0 0 -1.5vh; border-radius: 50%;
		background: #ffcc33; box-shadow: 0 0 0.5vh #000; }
	#ticket .won { color: #2e9e45; font-size: 3vh; margin-top: 0.5vh; }

	#results { background: radial-gradient(ellipse at 50% 40%, rgba(10, 16, 34, 0.9), rgba(0, 0, 6, 0.96)); display: none;
		text-align: center; padding-top: 20vh; line-height: 1.6; box-sizing: border-box; }
	#results .footer { position: absolute; left: 0; right: 0; bottom: 5vh; color: var(--label); font-size: 1.6vh; letter-spacing: 0.25em; }
</style>
</head>
<body>
	<div id="dark" class="layer"></div>
	<div id="rear" class="layer"></div>
	<div id="left" class="panel"><div class="head">LIFE SUPPORT</div><div class="stats"></div></div>
	<div id="clock" class="panel"><div class="k">COLONY AIR</div><div class="v"></div></div>
	<div id="right" class="panel"><div class="head">SPACE WEATHER</div><div class="stats"></div></div>
	<div id="alert"><span></span></div>
	<div id="center"></div>
	<div id="blackout"><div class="big">BLACKED OUT</div><div class="dim">THE TRUCK IS DRIFTING...</div></div>
	<div id="prompts"></div>
	<div id="nav" class="panel">
		<div class="row"><span class="k" id="distance"></span><span class="v" id="eta"></span></div>
		<div class="track"><div id="progress" class="fill"></div><div id="pip"></div>
			<span class="end" style="left: 0">DEPOT</span><span class="end" style="right: 0">COLONY</span></div>
		<div class="row" style="margin-top: 3vh"><span class="k" id="course"></span><span class="v" id="speed"></span></div>
		<div class="track" id="gaugeTrack"><div id="gauge" class="fill"></div></div>
	</div>
	<div id="bay" class="panel"><div class="head">CARGO BAY <b></b></div><svg viewBox="0 0 100 200"></svg><div class="foot"></div></div>
	<svg id="sight" class="layer"><line stroke="#fff" stroke-opacity="0.45" stroke-width="2"></line>
		<circle class="nose" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2"></circle><circle class="look" fill="none" stroke="#6fd3ff" stroke-width="2"></circle></svg>
	<div id="arrow"></div>
	<div id="ticket" class="pocket">
		<div class="title">SPACE SCRATCHER</div>
		<div class="card"><div class="prize"></div><canvas></canvas><div class="coin"></div></div>
		<div class="won"></div>
	</div>
	<div id="results" class="layer"><div class="lines"></div><div class="footer"></div></div>

<script>
	function line(l) {
		var size = l.size && l.size !== 1 ? "font-size:" + l.size + "em;" : "";
		return '<div style="white-space:pre;' + size + "color:" + l.c + '">' + esc(l.t) + "</div>";
	}
	function stat(s) {
		var meter = s.bar >= 0 ? '<div class="meter"><div style="width:' + (s.bar * 100) + "%;background:" + s.c + '"></div></div>' : "";
		return '<div class="stat"><span class="k">' + esc(s.k) + '</span><span class="v" style="color:' + s.c + '">' + esc(s.v) + "</span></div>" + meter;
	}
	function esc(text) { return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
	function $(id) { return document.getElementById(id); }
	// Rewriting the same markup still re-lays out the page, so skip it when nothing changed.
	function put(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }
	function lines(id, list) { put($(id), (list || []).map(line).join("")); }
	function stats(id, list) { put($(id).querySelector(".stats"), (list || []).map(stat).join("")); }
	function show(id, on) { $(id).style.display = on ? "block" : "none"; }

	var cell = 0, lastTicket;
	function drawTicket(t) {
		var key = JSON.stringify(t) + window.innerHeight;
		if (key === lastTicket) return;
		lastTicket = key;
		// Put away, it keeps the last card so it slides back into the pocket intact.
		var box = $("ticket");
		box.classList.toggle("pocket", !t);
		if (!t) return;
		cell = window.innerHeight * 0.3 / t.cols;
		var canvas = box.querySelector("canvas");
		canvas.width = t.cols * cell;
		canvas.height = t.rows * cell;
		var context = canvas.getContext("2d");
		context.clearRect(0, 0, canvas.width, canvas.height);
		context.fillStyle = "#8c9199";
		for (var i = 0; i < t.coating.length; ++i)
			if (t.coating[i] === "1")
				context.fillRect((i % t.cols) * cell, Math.floor(i / t.cols) * cell, cell + 1, cell + 1);
		box.querySelector(".prize").textContent = t.prize;
		var coin = box.querySelector(".coin");
		coin.style.display = t.revealed ? "none" : "block";
		coin.style.left = (t.x * 100) + "%";
		coin.style.top = (t.y * 100) + "%";
		box.querySelector(".won").textContent = t.revealed ? "YOU WON: " + t.prize : "";
	}

	engine.watch("hud", function (hud) {
		$("dark").style.opacity = hud.dark;
		stats("left", hud.left);
		var clock = $("clock").querySelector(".v");
		clock.textContent = hud.clock.v;
		clock.style.color = hud.clock.c;
		stats("right", hud.right);
		lines("center", hud.center);
		show("blackout", hud.blackout);
		lines("prompts", hud.prompts);

		$("distance").textContent = hud.distance.k;
		$("eta").textContent = hud.distance.v;
		$("progress").style.width = (hud.progress * 100) + "%";
		$("pip").style.left = (hud.progress * 100) + "%";
		$("course").textContent = hud.course.k;
		$("course").style.color = hud.course.c;
		$("speed").textContent = "SPEED " + hud.course.v;
		var gauge = $("gauge");
		gauge.style.width = (hud.course.bar * 100) + "%";
		gauge.style.background = hud.course.c;

		// The windshield's center (ring) joined to where you look (screen center): which way and how hard you are steering.
		var sight = $("sight");
		sight.style.display = hud.sight ? "block" : "none";
		if (hud.sight) {
			var w = window.innerWidth, h = window.innerHeight, r = h * 0.025;
			var nx = w / 2 + hud.sight.x * w / 2, ny = h / 2 - hud.sight.y * h / 2;
			var dx = nx - w / 2, dy = ny - h / 2, d = Math.sqrt(dx * dx + dy * dy);
			var gap = d > 2 * r ? r / d : 0.5;
			var l = sight.querySelector("line");
			l.setAttribute("x1", w / 2 + dx * gap); l.setAttribute("y1", h / 2 + dy * gap);
			l.setAttribute("x2", nx - dx * gap); l.setAttribute("y2", ny - dy * gap);
			var nose = sight.querySelector(".nose"), look = sight.querySelector(".look");
			nose.setAttribute("cx", nx); nose.setAttribute("cy", ny); nose.setAttribute("r", r);
			look.setAttribute("cx", w / 2); look.setAttribute("cy", h / 2); look.setAttribute("r", r * 0.5);
		}

		// Sits on an ellipse inside the screen's edge, pointing out toward the colony.
		var arrow = $("arrow");
		arrow.style.display = hud.arrow ? "block" : "none";
		if (hud.arrow) {
			arrow.style.left = (50 + hud.arrow.x * 45) + "%";
			arrow.style.top = (50 - hud.arrow.y * 40) + "%";
			arrow.style.transform = "rotate(" + (-Math.atan2(hud.arrow.y, hud.arrow.x) * 180 / Math.PI) + "deg)";
		}

		drawTicket(hud.ticket);
		show("results", !!hud.results);
		if (hud.results)
			put(document.querySelector("#results .lines"), hud.results.map(line).join(""));
	});

	// The bay from above, hatch (to the cab) at the top and the airlock wall on the left, in a 100 by 200 box.
	function bayX(x) { return 50 + x * 46; }
	function bayY(z) { return 100 - z * 96; }
	engine.watch("bay", function (bay) {
		var svg = '<rect x="2" y="2" width="96" height="196" rx="6" fill="rgba(120,140,180,0.06)" stroke="rgba(130,170,255,0.3)" stroke-width="1.5"/>'
			+ '<rect x="38" y="0" width="24" height="4" rx="2" fill="#6fd3ff" opacity="0.7"/>';
		bay.tanks.forEach(function (t) {
			var color = t[3] > 0 ? "#ff4d40" : t[4] ? "#4f8dff" : "#6fd3ff";
			svg += '<circle cx="' + bayX(t[0]) + '" cy="' + bayY(t[1]) + '" r="2.8" fill="' + color + '" fill-opacity="' + (0.15 + 0.75 * t[2])
				+ '" stroke="' + color + '" stroke-opacity="' + (t[2] > 0 ? 0.9 : 0.3) + '" stroke-width="0.8"/>';
		});
		bay.mites.forEach(function (m) {
			var x = bayX(m[0]), y = bayY(m[1]);
			if (m[2])
				svg += '<circle cx="' + x + '" cy="' + y + '" r="10" fill="none" stroke="#ff4d40" stroke-width="1.6" class="mite"/>';
			svg += '<circle cx="' + x + '" cy="' + y + '" r="' + (m[2] ? 5 : 4) + '" fill="#ff4d40" stroke="#000" stroke-opacity="0.6"/>';
		});
		if (bay.you)
			svg += '<circle cx="' + bayX(bay.you[0]) + '" cy="' + bayY(bay.you[1]) + '" r="3.4" fill="#fff" stroke="#000" stroke-opacity="0.5"/>';
		var box = $("bay");
		put(box.querySelector("svg"), svg);
		box.querySelector(".head b").textContent = Math.round(bay.o2 * 100) + "% O2";
		box.classList.toggle("alarm", bay.feeding > 0);
		var foot = [];
		if (bay.count) foot.push(bay.count + (bay.count === 1 ? " MITE" : " MITES"));
		if (bay.leaks) foot.push(bay.leaks + (bay.leaks === 1 ? " LEAK" : " LEAKS"));
		var footer = box.querySelector(".foot");
		footer.textContent = foot.length ? foot.join(" · ") : "ALL CLEAR";
		footer.style.color = foot.length ? "#ff8a80" : "";

		// Up in the cab you can't see the bay, so the HUD calls out what is loose back there.
		var alert = $("alert");
		var loose = bay.cab && bay.count > 0;
		alert.style.display = loose ? "block" : "none";
		alert.classList.toggle("feeding", bay.feeding > 0);
		if (loose)
			alert.querySelector("span").textContent = "▼ " + bay.count + (bay.count === 1 ? " SIPHON" : " SIPHONS") + " IN THE BAY"
				+ (bay.feeding ? " · " + bay.feeding + " FEEDING" : "");
		$("rear").classList.toggle("on", bay.cab && bay.feeding > 0);
	});
</script>
</body>
</html>
